<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>From Folk Authenticity to Populist Politics</title>
  <style>
    :root {
      --stage-width: 800;
      --stage-height: 600;
      --stage-scale: 1;
      --bg: #090909;
      --panel: #111111;
      --panel-2: #151515;
      --text: #f2f2f2;
      --muted: #b8b8b8;
      --soft: #8d8d8d;
      --line: rgba(255, 255, 255, 0.14);
      --accent: #ffffff;
      --burns-red: #9d1f1f;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.05), transparent 28%),
        radial-gradient(circle at 80% 10%, rgba(255,255,255,0.03), transparent 18%),
        linear-gradient(180deg, #050505 0%, #0d0d0d 100%);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.025) 0,
          rgba(255,255,255,0.025) 1px,
          rgba(0,0,0,0.075) 2px,
          transparent 4px
        );
      opacity: 0.72;
      mix-blend-mode: overlay;
      animation: scanlineDrift 8s linear infinite;
    }

    .deck {
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(var(--stage-width) * 1px);
      height: calc(var(--stage-height) * 1px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transform: translate(-50%, -50%) scale(var(--stage-scale));
      transform-origin: center;
    }

    .deck::before,
    .deck::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 101;
      pointer-events: none;
    }

    .deck::before {
      background:
        linear-gradient(90deg, rgba(255, 24, 24, 0.018), transparent 2px, rgba(30, 110, 255, 0.018) 4px),
        repeating-radial-gradient(ellipse at center, transparent 0 3px, rgba(255,255,255,0.018) 4px);
      background-size: 6px 100%, 7px 5px;
      opacity: 0.55;
      mix-blend-mode: screen;
      animation: tapeNoise 180ms steps(2, end) infinite;
    }

    .deck::after {
      background:
        linear-gradient(180deg, transparent 0 42%, rgba(255,255,255,0.075) 46%, rgba(0,0,0,0.14) 49%, transparent 54%),
        radial-gradient(ellipse at center, transparent 48%, rgba(0,0,0,0.2) 78%, rgba(0,0,0,0.58) 115%);
      background-size: 100% 240%, 100% 100%;
      opacity: 0.72;
      animation: trackingRoll 11s linear infinite;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 58% 42%;
      gap: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 420ms ease;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent 25%);
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
      animation: tapeJitter 7s steps(1, end) infinite;
    }

    .slide.title-screen {
      grid-template-columns: 1fr;
      background:
        radial-gradient(circle at 50% 28%, rgba(255,255,255,0.08), transparent 44%),
        linear-gradient(180deg, #090909 0%, #050505 100%);
    }

    .slide.title-screen .visual {
      display: none;
    }

    .slide.title-screen .content {
      min-height: 600px;
      padding: 42px 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: transparent;
      gap: 0.95rem;
    }

    .slide.title-screen .content > div:nth-of-type(2) {
      width: min(60rem, 100%);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .slide.title-screen .eyebrow {
      display: none;
    }

    .slide.title-screen h1 {
      max-width: 14ch;
      font-size: 50px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      line-height: 0.92;
      text-shadow: 0 10px 30px rgba(0,0,0,0.55);
    }

    .slide.title-screen .title-divider {
      margin-left: auto;
      margin-right: auto;
      width: min(18rem, 62vw);
    }

    .slide.title-screen .deck-title {
      max-width: 42rem;
      margin-top: 1rem;
      margin-left: auto;
      margin-right: auto;
      font-size: 16px;
      line-height: 1.52;
      text-wrap: balance;
      text-align: center;
      color: #d6d6d6;
    }

    .slide.title-screen .footer {
      display: none;
    }

    .interstitial {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 520ms ease, visibility 0s linear 520ms;
    }

    .slide.previewing .interstitial {
      opacity: 1;
      visibility: visible;
      transition: none;
    }

    .interstitial-label {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 45px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #ececec;
      text-align: center;
      padding: 0 6vw;
      text-wrap: balance;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 520ms ease 120ms, transform 520ms ease 120ms;
    }

    .slide.previewing .interstitial-label {
      opacity: 1;
      transform: translateY(0);
    }

    .visual {
      position: relative;
      overflow: hidden;
      border-right: 1px solid var(--line);
      background: #0b0b0b;
    }

    .visual::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.08), rgba(0,0,0,0.38));
      pointer-events: none;
    }

    .kenburns {
      position: absolute;
      inset: -12%;
      width: 124%;
      height: 124%;
      object-fit: cover;
      filter: grayscale(1) contrast(1.18) brightness(0.92);
      transform-origin: center center;
      transform: translate3d(var(--from-x, 0%), var(--from-y, 0%), 0) scale(var(--from-scale, 1.04));
      animation: kenburnsMove var(--kenburns-duration, 20s) ease-in-out infinite alternate;
      opacity: 0;
      transition: opacity 1100ms ease;
      will-change: transform, opacity;
    }

    .kenburns.is-visible {
      opacity: 0.95;
      animation-name: kenburnsMove, tapeFlicker;
      animation-duration: var(--kenburns-duration, 20s), 3.4s;
      animation-timing-function: ease-in-out, steps(1, end);
      animation-iteration-count: infinite, infinite;
      animation-direction: alternate, normal;
    }

    .kenburns.alt {
      animation-duration: 22s;
    }

    .kenburns.soft {
      animation-duration: 25s;
    }

    .content {
      padding: 42px 40px 36px 37px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 2.2vh;
      background:
        radial-gradient(circle at top right, rgba(255,255,255,0.08), transparent 30%),
        linear-gradient(180deg, rgba(255,255,255,0.03), transparent 18%);
    }

    .eyebrow {
      display: none;
    }

    h1, h2 {
      margin: 0;
      font-weight: 600;
      line-height: 0.96;
      text-wrap: balance;
    }

    h1 {
      font-size: 41px;
      max-width: 10ch;
    }

    h2 {
      font-size: 33px;
      max-width: 12ch;
    }

    .deck-title {
      margin-top: 0.2rem;
      font-size: 14px;
      color: var(--muted);
      max-width: 34rem;
      line-height: 1.55;
    }

    .title-divider {
      width: min(13rem, 36vw);
      height: 3px;
      margin: 0.95rem 0 0.7rem;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(157, 31, 31, 0.96), rgba(157, 31, 31, 0.35));
      box-shadow: 0 0 18px rgba(157, 31, 31, 0.25);
    }

    .narration {
      position: absolute;
      left: 50%;
      bottom: 52px;
      z-index: 20;
      width: fit-content;
      max-width: 320px;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      color: #fff;
      font-family: "Lucida Console", "Courier New", Courier, monospace;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: 0.025em;
      text-align: center;
      text-transform: uppercase;
      text-wrap: balance;
      text-shadow:
        -1px -1px 0 #000,
        0 -1px 0 #000,
        1px -1px 0 #000,
        -1px 0 0 #000,
        1px 0 0 #000,
        -1px 1px 0 #000,
        0 1px 0 #000,
        1px 1px 0 #000;
      transform: translateX(-50%) scale(2);
      transform-origin: center bottom;
      -webkit-font-smoothing: none;
      display: none;
      visibility: hidden;
      margin: 0;
      overflow: hidden;
    }

    body.show-narration-text .slide.active:not(.previewing) .narration:not(:empty) {
      display: block;
      visibility: visible;
      animation: captionIn 90ms steps(2, end);
    }


    .subline {
      max-width: 32rem;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.65;
    }

    .footer {
      display: flex;
      align-items: end;
      justify-content: flex-end;
      gap: 1rem;
      color: var(--soft);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .counter {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.5rem 0.82rem;
      background: rgba(255,255,255,0.03);
    }

    .hint {
      opacity: 0.75;
    }

    .notes {
      display: none;
    }

    @keyframes kenburnsMove {
      0% {
        transform: translate3d(var(--from-x, 0%), var(--from-y, 0%), 0) scale(var(--from-scale, 1.04));
      }
      100% {
        transform: translate3d(var(--to-x, -6%), var(--to-y, -5%), 0) scale(var(--to-scale, 1.2));
      }
    }

    @keyframes scanlineDrift {
      to { background-position: 0 12px; }
    }

    @keyframes tapeNoise {
      0% { transform: translate(0, 0); opacity: 0.48; }
      25% { transform: translate(-1px, 1px); opacity: 0.58; }
      50% { transform: translate(1px, 0); opacity: 0.5; }
      75% { transform: translate(0, -1px); opacity: 0.62; }
    }

    @keyframes trackingRoll {
      from { background-position: 0 -120vh, center; }
      to { background-position: 0 120vh, center; }
    }

    @keyframes tapeJitter {
      0%, 88%, 92%, 100% { transform: translate(0, 0); }
      89% { transform: translate(1px, 0); }
      90% { transform: translate(-2px, 1px); }
      91% { transform: translate(0, -1px); }
    }

    @keyframes tapeFlicker {
      0%, 93%, 100% { filter: grayscale(1) contrast(1.18) brightness(0.92); }
      94% { filter: grayscale(0.92) contrast(1.26) brightness(1.02); }
      95% { filter: grayscale(1) contrast(1.14) brightness(0.86); }
    }

    @keyframes captionIn {
      from { opacity: 0.2; transform: translateX(-50%) translateY(1px) scale(2); }
      to { opacity: 1; transform: translateX(-50%) translateY(0) scale(2); }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before,
      .deck::before,
      .deck::after,
      .slide.active {
        animation: none;
      }
    }

  </style>
</head>
<body>
  <main class="deck" id="deck"></main>

  <template id="slide-template">
    <section class="slide">
      <div class="visual">
        <img class="kenburns" alt="" />
      </div>
      <div class="content">
        <div class="eyebrow"></div>
        <div>
          <h1></h1>
          <div class="title-divider" aria-hidden="true"></div>
          <p class="deck-title"></p>
        </div>
        <div class="narration" aria-hidden="true"></div>
        <div class="footer"></div>
      </div>
      <div class="interstitial" aria-hidden="true">
        <span class="interstitial-label"></span>
      </div>
    </section>
  </template>

  <script>
    const slides = [
      {
        eyebrow: "",
        title: "From Folk Authenticity to Populist Politics",
        subtitle: "An American story about style, music, and the system that exploited them.",
        narration: "",
        image: "assets/opening.jpg",
        variant: "alt",
        holdMs: 7800,
        layout: "title-screen"
      },
      {
        eyebrow: "Honest Beginnings",
        title: "Authenticity becomes political",
        subtitle: "It began with a playlist.",
        narration: "Behind the banjos, beards, and folksy swagger, something quieter was taking hold. {{pause 900}} The financial crisis had knocked the varnish off the American promise. The new folk music suited that mood. It was earnest, loud, and easy to join. Mumford and Sons had no political program. At their shows, strangers sang the same words and briefly felt like a community. That was a relief in a country losing faith in its institutions. Nobody in the room could have known where the feeling would lead.",
        images: ["assets/opening.jpg", "assets/mill.jpg"],
        variant: ""
      },
      {
        eyebrow: "The folk ideal",
        title: "The promise of sincerity",
        subtitle: "Wood, wire, and a room that sings in unison.",
        narration: "After decades of over-processed culture, people went looking for authenticity, preferably made from reclaimed wood and organic waxed cotton. {{pause 900}} Obama took office in two thousand nine, with change in the air. A generation turned away from the polish and commodification of the previous decades. Handclaps and banjos supplied the soundtrack. {{pause 400}} The look was heavily styled. The longing underneath it was real. The past seemed simpler and more coherent once its hardships and exclusions had been cropped out of frame.",
        images: ["assets/folk-ideal.jpg", "assets/soup.jpg"],
        variant: "alt"
      },
      {
        eyebrow: "The hey band bloom",
        title: "The earnest chorus arrives",
        subtitle: "Handclaps become social policy.",
        narration: "In the winter of twenty ten, Mumford and Sons' debut, Sigh No More, found its American audience. Indie intimacy grew into an arena ritual. {{pause 400}} The arrangements made the jump easily. A quiet opening gathered speed until thousands of strangers could take over the chorus. {{pause 400}} Everyone learned when to clap. {{pause 400}} The audience practiced belonging through rhythm, and the body remembers that kind of participation.",
        images: ["assets/hey-band.jpg", "assets/banjo-guy.jpg"],
        variant: "soft"
      }, 
      {
        eyebrow: "The Proof of Genuine",
        title: "Craft enters the republic",
        subtitle: "Measure, stir, repeat.",
        narration: "By September twenty twelve, Babel debuted at number one on both sides of the Atlantic. The vocabulary of the music had followed listeners home. {{pause 400}} Cocktails came with origin stories. Furniture wore a maker's mark. Clothes were sold with a tale of survival against modernity. {{pause 400}} At the bar, ratios and glassware became measures of character. {{pause 400}} Restaurants and retailers adopted the same grammar. Taste now carried a moral charge.",
        images: ["assets/cocktail.jpg"],
        variant: "soft"
      },
      {
        eyebrow: "The authenticity industrial complex",
        title: "The rejection gets repackaged",
        subtitle: "The market never misses a mood, or a membership signal.",
        narration: "The market quickly learned how to sell this rejection of consumer culture. {{pause 400}} The folk look spread through cocktail bars and boutique food scenes, where taste became another way to rank people. {{pause 400}} Major retailers reproduced workshops, general stores, and family farms. Even the rough edges arrived pre-distressed. {{pause 400}} On stage, Mumford and Sons filled arenas under lighting designed to preserve the warm glow of a much smaller room.",
        images: ["assets/beard-corridor.jpg"],
        variant: "alt"
      },
      {
        eyebrow: "Self-reliance",
        title: "Trust yourself, trust others less",
        subtitle: "Pantry, survival, and the politics of independence.",
        narration: "The handmade revival brought do-it-yourself skills back into fashion. People repaired old tools, planted gardens, and stocked pantries. {{pause 400}} Soon self-reliance carried a harsher message. Calling a tradesman, listening to a doctor, or depending on a public agency could be dismissed as weakness. {{pause 400}} Fixing your own sink is useful. Treating every form of public expertise as a fraud is politics.",
        images: ["assets/self-reliance.jpg", "assets/tools.jpg"],
        variant: ""
      },
      {
        eyebrow: "Anti-elite drift",
        title: "Suspicion replaces evidence",
        subtitle: "Everyone is lying, all the time.",
        narration: "Legitimate criticism hardened into permanent suspicion. {{pause 400}} Distrust itself became proof of good judgment. {{pause 400}} The folk revival had made the posture look warm and familiar. Its stars claimed the manners of outsiders while a global entertainment business filled their venues. {{pause 400}} Wealthy, well-connected candidates soon made the same claim about politics.",
        images: ["assets/anti-elite-drift.jpg"],
        variant: "alt"
      },
      {
        eyebrow: "The acoustic pipeline",
        title: "Style travels faster than ideology",
        subtitle: "The soundtrack crosses the border first.",
        narration: "In twenty fifteen, the band traded the banjo for electric guitars on Wilder Mind, and the acoustic wave began to recede from the pop charts. {{pause 400}} By then, millions of people already knew the visual language. Politics could summon the same feelings with a barn, a flag, or a weathered face. {{pause 400}} Nostalgia settled on older, whiter visions of national life. In America it borrowed small-town imagery. In Europe it revived purity myths under the name of tradition. {{pause 400}} No campaign needed to mention the music for those associations to work.",
        images: ["assets/acoustic-pipeline.jpg", "assets/folksy.jpg"],
        variant: ""
      },
      {
        eyebrow: "The feed",
        title: "Authenticity becomes inventory",
        subtitle: "The algorithm discovers a market.",
        narration: "By the mid twenty tens, interests that once lived on separate shelves met every day in the feed. {{pause 400}} A farm-table recipe sat beside a warning about seed oils. Next came a politician promising national restoration. {{pause 400}} Corporations packaged the handmade look. Influencers sold independence. Politicians performed outsider status. Outrage kept the whole sequence moving. {{pause 400}} MAGA turned nostalgia into a product identity. MAHA did the same with bodily purity. {{pause 400}} Platforms measured attention and supplied more of whatever held it.",
        image: "assets/maga.jpg",
        variant: "alt"
      },
      {
        eyebrow: "The irony economy",
        title: "From Vice to grievance",
        subtitle: "Snark opens the gate.",
        narration: "In November twenty sixteen, days after the election, white-nationalist organizer Richard Spencer told a Washington crowd, 'Hail Trump. Hail our people. Hail victory.' {{pause 400}} Half the room laughed. The other half saluted. {{pause 400}} Irony offered plausible deniability: if challenged, it was a joke; if rewarded, it was sincere. {{pause 400}} That posture let extremist ideas travel among people who would have rejected them delivered plainly.",
        images: ["assets/spencer.jpg", "assets/outrage.jpg"],
        variant: "alt"
      },
      {
        eyebrow: "Populism",
        title: "From belonging to hierarchy",
        subtitle: "Trump accelerates an existing pattern.",
        narration: "Donald Trump found a ready market for performed authenticity and made it louder. {{pause 400}} MAGA organized fear around borders and belonging. MAHA applied a similar logic to bodies and contamination. {{pause 400}} Grievance and distrust sustained a movement larger than one candidate. Its rallies also used familiar arena techniques. A repeated phrase drew an anticipated response; a music cue gathered thousands of voices until individual hesitation disappeared. {{pause 400}} The rush of certainty crossed easily from concert hall to rally.",
        images: ["assets/irony-economy.jpg", "assets/trumpcrowd.jpg"],
        variant: "soft"
      },
      {
        eyebrow: "Consequences",
        title: "What fascist culture leaves behind",
        subtitle: "Pluralism thins out, then institutions do.",
        narration: "By the time Delta arrived in November twenty eighteen, Trump was in office and nostalgia had stopped being a private longing. {{pause 400}} It had become a governing demand, complete with an approved past and a list of people accused of ruining it. Fascist politics stopped sounding fringe and started sounding normal. {{pause 400}} Damage moved from screens to systems: public-health trust collapsed, school boards became proxy battlefields, and state power was aimed at local enemies instead of shared problems. {{pause 400}} Institutions built for disagreement cannot work for long when disagreement itself is treated as contamination.",
        images: ["assets/populism.jpg", "assets/massive.jpg"],
        variant: "alt"
      },
      {
        eyebrow: "Finale",
        title: "The empire burns",
        subtitle: "Mumford fiddles",
        narration: "In twenty twenty five, Mumford and Sons returned to the banjo with Rushmere. The sound landed like a costume the country had already outgrown. {{pause 700}} Mumford and Sons helped create cultural conditions in which fascism could grow. {{pause 400}} Their music idealized the past and gave collective feeling the authority of truth. Arena-sized participation could still feel intimate, wholesome, and honest. {{pause 400}} Those habits survived the folk revival. Political operators learned how to use them. {{pause 900}} Thank you. {{pause 900}} This wouldn't be possible without viewers like you.",
        images: ["assets/empire-burns.jpg",
          "assets/soldier.jpg",
          "assets/protests.jpg",
          "assets/mumford.jpg",
          "assets/crowd.jpg",
          "assets/clown.jpg",
          "assets/crowd2.jpg",
          "assets/smoke.jpg"         
          ],
        variant: "alt"
      }
    ];

    const deck = document.getElementById('deck');
    const template = document.getElementById('slide-template');
    let current = 0;
    const nodes = [];
    const narrationAudio = new Audio();
    narrationAudio.preload = 'auto';
    let narratedTrackCount = 0;
    const narrationTrackBySlide = slides.map((slide) => {
      if (!(slide.narration || '').trim()) {
        return null;
      }
      narratedTrackCount += 1;
      return `assets/narration/slide-${String(narratedTrackCount).padStart(2, '0')}.wav`;
    });
    const backgroundAudio = new Audio();
    backgroundAudio.preload = 'auto';
    backgroundAudio.loop = true;
    const musicBaseVolume = 0.20;
    const musicDuckedVolume = 0.13;
    const backgroundAudioSources = [
      'assets/bluegrass-trimmed.mp3',
      'assets/bluegrass.mp3'
    ];
    let activeMusicSourceIndex = 0;
    backgroundAudio.volume = musicBaseVolume;
    backgroundAudio.src = encodeURI(backgroundAudioSources[activeMusicSourceIndex]);
    let narrationEnabled = true;
    let narrationUnlocked = false;
    let playbackStarted = false;
    let narrationTextVisible = true;
    let activeCaptionCues = [];
    let autoAdvanceEnabled = true;
    let backgroundMusicEnabled = true;
    let musicFadeTimer = null;
    let autoAdvanceTimer = null;
    let silentSlideTimer = null;
    let interstitialTimer = null;
    const autoAdvanceDelayMs = 3200;
    const interstitialDurationMs = 4200;
    const postInterstitialSettleMs = 1100;
    const defaultImageHoldMs = 8500;
    const minImageHoldMs = 4000;
    const slideImageState = [];

    function updateStageScale() {
      const scale = Math.min(window.innerWidth / 800, window.innerHeight / 600);
      document.documentElement.style.setProperty('--stage-scale', String(scale));
    }

    function setMusicVolume(targetVolume, durationMs = 260) {
      if (!backgroundMusicEnabled) {
        return;
      }

      const startVolume = backgroundAudio.volume;
      const clampedTarget = Math.max(0, Math.min(1, targetVolume));

      if (musicFadeTimer) {
        clearInterval(musicFadeTimer);
        musicFadeTimer = null;
      }

      if (Math.abs(startVolume - clampedTarget) < 0.002 || durationMs <= 0) {
        backgroundAudio.volume = clampedTarget;
        return;
      }

      const frameMs = 30;
      const steps = Math.max(1, Math.round(durationMs / frameMs));
      let step = 0;

      musicFadeTimer = setInterval(() => {
        step += 1;
        const progress = Math.min(1, step / steps);
        backgroundAudio.volume = startVolume + (clampedTarget - startVolume) * progress;
        if (progress >= 1) {
          clearInterval(musicFadeTimer);
          musicFadeTimer = null;
        }
      }, frameMs);
    }

    function applyNarrationTextVisibility() {
      document.body.classList.toggle('show-narration-text', narrationTextVisible);
    }

    function initializeNarrationTextPreference() {
      const params = new URLSearchParams(window.location.search);
      const queryPref = params.get('showNarration');
      const storedPref = window.localStorage.getItem('showNarrationText');
      narrationTextVisible = queryPref === '0' ? false : storedPref !== '0';
      applyNarrationTextVisibility();
    }

    function splitCaptionPhrases(text) {
      const clauses = text.match(/[^,;:.!?]+[,;:.!?]+|[^,;:.!?]+$/g) || [];
      return clauses.flatMap((clause) => {
        const words = clause.trim().split(/\s+/).filter(Boolean);
        if (words.length <= 6) {
          return [words.join(' ')];
        }
        const phrases = [];
        for (let i = 0; i < words.length; i += 6) {
          phrases.push(words.slice(i, i + 6).join(' '));
        }
        return phrases;
      }).filter(Boolean);
    }

    function buildCaptionCues(narration, durationSeconds) {
      const markerPattern = /\{\{\s*(?:joe|amy|ryan|norman|lessac|pause(?:\s+(\d+))?)\s*\}\}/gi;
      const timeline = [];
      let cursor = 0;
      let match;

      while ((match = markerPattern.exec(narration)) !== null) {
        const speech = narration.slice(cursor, match.index).trim();
        if (speech) {
          splitCaptionPhrases(speech).forEach((text) => timeline.push({ type: 'speech', text }));
        }
        if (match[1]) {
          timeline.push({ type: 'pause', duration: Number(match[1]) / 1000 });
        }
        cursor = markerPattern.lastIndex;
      }

      const tail = narration.slice(cursor).trim();
      if (tail) {
        splitCaptionPhrases(tail).forEach((text) => timeline.push({ type: 'speech', text }));
      }

      const pauseDuration = timeline.reduce((total, item) => total + (item.type === 'pause' ? item.duration : 0), 0);
      const totalWords = timeline.reduce((total, item) => total + (item.type === 'speech' ? item.text.split(/\s+/).length : 0), 0);
      const speechDuration = Math.max(0, durationSeconds - pauseDuration);
      const cues = [];
      let time = 0;

      timeline.forEach((item) => {
        if (item.type === 'pause') {
          time += item.duration;
          return;
        }
        const words = item.text.split(/\s+/).length;
        const duration = totalWords > 0 ? speechDuration * (words / totalWords) : 0;
        cues.push({ start: time, end: time + duration, text: item.text });
        time += duration;
      });

      return cues;
    }

    function updateCaption() {
      const caption = nodes[current]?.querySelector('.narration');
      if (!caption) {
        return;
      }
      const now = narrationAudio.currentTime;
      const cue = activeCaptionCues.find((item) => now >= item.start && now < item.end);
      const nextText = cue?.text || '';
      if (caption.textContent !== nextText) {
        caption.textContent = nextText;
      }
    }

    function audioPathForSlide(index) {
      return narrationTrackBySlide[index];
    }

    function playNarrationForCurrentSlide() {
      if (!narrationEnabled || !narrationUnlocked) {
        return;
      }

      playBackgroundMusic();
      const narrationText = (slides[current]?.narration || '').trim();

      if (!narrationText) {
        setMusicVolume(musicBaseVolume, 420);
        if (autoAdvanceEnabled && current < slides.length - 1) {
          const holdMs = slides[current]?.holdMs ?? 6500;
          if (silentSlideTimer) {
            clearTimeout(silentSlideTimer);
            silentSlideTimer = null;
          }
          silentSlideTimer = setTimeout(() => {
            silentSlideTimer = null;
            setActive(current + 1);
          }, holdMs);
        }
        return;
      }

      setMusicVolume(musicDuckedVolume, 220);

      const nextSource = audioPathForSlide(current);
      if (!nextSource) {
        return;
      }
      const existing = narrationAudio.getAttribute('src');
      if (existing !== nextSource) {
        narrationAudio.setAttribute('src', nextSource);
      } else {
        narrationAudio.currentTime = 0;
      }

      narrationAudio.play().catch(() => {
        // Browser may block autoplay before user interaction; this fails safely.
      });
    }

    function playBackgroundMusic() {
      if (!backgroundMusicEnabled || !narrationUnlocked) {
        return;
      }

      backgroundAudio.muted = false;
      if (backgroundAudio.src === '') {
        backgroundAudio.src = encodeURI(backgroundAudioSources[activeMusicSourceIndex]);
      }

      backgroundAudio.play().catch(() => {
        // Browser may block autoplay before user interaction; this fails safely.
      });
    }

    backgroundAudio.addEventListener('error', () => {
      if (activeMusicSourceIndex >= backgroundAudioSources.length - 1) {
        return;
      }

      activeMusicSourceIndex += 1;
      backgroundAudio.src = encodeURI(backgroundAudioSources[activeMusicSourceIndex]);
      if (narrationUnlocked && backgroundMusicEnabled) {
        playBackgroundMusic();
      }
    });

    backgroundAudio.addEventListener('playing', () => {
      playbackStarted = true;
    });

    narrationAudio.addEventListener('playing', () => {
      playbackStarted = true;
    });

    function unlockNarration() {
      const currentNarrationText = (slides[current]?.narration || '').trim();
      const musicBlocked = backgroundMusicEnabled && backgroundAudio.paused;
      const narrationBlocked = Boolean(currentNarrationText) && !interstitialTimer && narrationAudio.paused;
      const needsKick = !narrationUnlocked || !playbackStarted || musicBlocked || narrationBlocked;
      narrationUnlocked = true;
      if (needsKick) {
        playBackgroundMusic();
        playNarrationForCurrentSlide();
        return true;
      }
      return false;
    }

    function beginExperienceOnLoad() {
      narrationUnlocked = false;
      playbackStarted = false;
    }

    narrationAudio.addEventListener('ended', () => {
      const caption = nodes[current]?.querySelector('.narration');
      if (caption) {
        caption.textContent = '';
      }
      if (!autoAdvanceEnabled) {
        setMusicVolume(musicBaseVolume, 420);
        return;
      }
      if (current < slides.length - 1) {
        if (autoAdvanceTimer) {
          clearTimeout(autoAdvanceTimer);
          autoAdvanceTimer = null;
        }
        autoAdvanceTimer = setTimeout(() => {
          autoAdvanceTimer = null;
          setActive(current + 1);
        }, autoAdvanceDelayMs);
        return;
      }
      setMusicVolume(musicBaseVolume, 420);
    });

    function createSlide(data, index) {
      const node = template.content.cloneNode(true);
      const slide = node.querySelector('.slide');
      const eyebrow = node.querySelector('.eyebrow');
      const title = node.querySelector('h1');
      const subtitle = node.querySelector('.deck-title');
      const narration = node.querySelector('.narration');
      const counter = node.querySelector('.counter');
      const visualContainer = node.querySelector('.visual');
      const templateImage = visualContainer.querySelector('.kenburns');
      const interstitialLabel = node.querySelector('.interstitial-label');
      if (interstitialLabel) {
        interstitialLabel.textContent = data.eyebrow || '';
      }

      eyebrow.textContent = data.eyebrow;
      title.textContent = data.title;
      subtitle.textContent = data.subtitle;
      narration.textContent = '';
      narration.setAttribute('role', 'status');
      narration.setAttribute('aria-live', 'off');
      if (counter) {
        counter.textContent = `${String(index + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;
      }
      if (data.layout) {
        slide.classList.add(data.layout);
      }

      const motionPresets = [
        { fromX: '3%', fromY: '2%', toX: '-7%', toY: '-6%', fromScale: '1.06', toScale: '1.22' },
        { fromX: '-5%', fromY: '-2%', toX: '6%', toY: '4%', fromScale: '1.07', toScale: '1.23' },
        { fromX: '6%', fromY: '-4%', toX: '-5%', toY: '5%', fromScale: '1.05', toScale: '1.21' },
        { fromX: '-4%', fromY: '4%', toX: '5%', toY: '-6%', fromScale: '1.06', toScale: '1.2' },
        { fromX: '2%', fromY: '-5%', toX: '-6%', toY: '3%', fromScale: '1.08', toScale: '1.24' },
        { fromX: '-6%', fromY: '1%', toX: '4%', toY: '-4%', fromScale: '1.05', toScale: '1.22' }
      ];
      const wordCount = (data.narration || '').trim().split(/\s+/).filter(Boolean).length;
      const paceSeconds = Math.max(20, Math.min(28, Math.round(wordCount / 3) + 14));

      const imageList = Array.isArray(data.images) && data.images.length > 0
        ? data.images
        : (data.image ? [data.image] : []);

      // Remove the template's placeholder image; we build our own stack.
      if (templateImage) {
        templateImage.remove();
      }

      const imgEls = imageList.map((src, i) => {
        const img = document.createElement('img');
        img.className = 'kenburns';
        img.alt = '';
        img.src = src;
        if (data.variant) {
          img.classList.add(data.variant);
        }
        const motion = motionPresets[(index + i) % motionPresets.length];
        const durationSeconds = Math.max(18, paceSeconds + ((index + i) % 4) * 2 - 2);
        img.style.setProperty('--from-x', motion.fromX);
        img.style.setProperty('--from-y', motion.fromY);
        img.style.setProperty('--to-x', motion.toX);
        img.style.setProperty('--to-y', motion.toY);
        img.style.setProperty('--from-scale', motion.fromScale);
        img.style.setProperty('--to-scale', motion.toScale);
        img.style.setProperty('--kenburns-duration', `${durationSeconds}s`);
        if (i === 0) {
          img.classList.add('is-visible');
        }
        visualContainer.insertBefore(img, visualContainer.firstChild);
        return img;
      });

      slideImageState[index] = {
        imgs: imgEls,
        count: imgEls.length,
        holdMs: Number.isFinite(data.imageHoldMs) ? data.imageHoldMs : null,
        cursor: 0,
        timer: null
      };

      slide.dataset.index = index;
      return slide;
    }

    function render() {
      deck.innerHTML = '';
      slides.forEach((slide, index) => {
        const node = createSlide(slide, index);
        deck.appendChild(node);
        nodes.push(node);
      });
      setActive(0, false);
    }

    function stopImageCycleForSlide(index) {
      const state = slideImageState[index];
      if (state && state.timer) {
        clearInterval(state.timer);
        state.timer = null;
      }
    }

    function stopAllImageCycles() {
      slideImageState.forEach((_, i) => stopImageCycleForSlide(i));
    }

    function computeImageHoldMs(index) {
      const state = slideImageState[index];
      if (!state || state.count <= 1) {
        return defaultImageHoldMs;
      }
      if (state.holdMs) {
        return state.holdMs;
      }
      const narrationSecs = index === current && Number.isFinite(narrationAudio.duration) && narrationAudio.duration > 0
        ? narrationAudio.duration
        : 0;
      if (narrationSecs > 0) {
        // Divide narration across image slots, plus a little tail so the last image lingers.
        const slot = (narrationSecs * 1000) / state.count;
        return Math.max(minImageHoldMs, Math.floor(slot));
      }
      return defaultImageHoldMs;
    }

    function startImageCycleForSlide(index) {
      const state = slideImageState[index];
      if (!state || state.count <= 1) {
        return;
      }
      stopImageCycleForSlide(index);
      state.cursor = 0;
      state.imgs.forEach((img, i) => {
        img.classList.toggle('is-visible', i === 0);
      });
      const holdMs = computeImageHoldMs(index);
      state.timer = setInterval(() => {
        state.cursor = (state.cursor + 1) % state.count;
        state.imgs.forEach((img, i) => {
          img.classList.toggle('is-visible', i === state.cursor);
        });
      }, holdMs);
    }

    // Re-time the current slide's image cycle once narration duration is known.
    narrationAudio.addEventListener('loadedmetadata', () => {
      activeCaptionCues = buildCaptionCues(slides[current]?.narration || '', narrationAudio.duration);
      updateCaption();
      const state = slideImageState[current];
      if (!state || state.count <= 1 || !state.timer) {
        return;
      }
      startImageCycleForSlide(current);
    });

    function setActive(index, animate = true) {
      if (autoAdvanceTimer) {
        clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = null;
      }
      if (silentSlideTimer) {
        clearTimeout(silentSlideTimer);
        silentSlideTimer = null;
      }
      if (interstitialTimer) {
        clearTimeout(interstitialTimer);
        interstitialTimer = null;
      }
      stopAllImageCycles();
      activeCaptionCues = [];
      nodes.forEach((node) => {
        const caption = node.querySelector('.narration');
        if (caption) {
          caption.textContent = '';
        }
      });
      nodes.forEach((node) => node.classList.remove('previewing'));
      current = Math.max(0, Math.min(index, slides.length - 1));
      nodes.forEach((node, i) => node.classList.toggle('active', i === current));
      if (!animate) {
        nodes[current].style.transition = 'none';
        requestAnimationFrame(() => {
          nodes[current].style.transition = '';
        });
      }

      const slideData = slides[current];
      const showInterstitial =
        slideData
        && slideData.layout !== 'title-screen'
        && (slideData.eyebrow || '').trim().length > 0;

      if (showInterstitial) {
        const activeNode = nodes[current];
        activeNode.classList.add('previewing');
        // Keep music playing under the interstitial, but hold narration until reveal.
        playBackgroundMusic();
        interstitialTimer = setTimeout(() => {
          interstitialTimer = null;
          activeNode.classList.remove('previewing');
          // Give the reveal a beat of air before narration starts.
          interstitialTimer = setTimeout(() => {
            interstitialTimer = null;
            playNarrationForCurrentSlide();
            startImageCycleForSlide(current);
          }, postInterstitialSettleMs);
        }, interstitialDurationMs);
      } else {
        playNarrationForCurrentSlide();
        startImageCycleForSlide(current);
      }
    }

    document.addEventListener('keydown', (event) => {
      const justStarted = unlockNarration();
      if (justStarted) {
        event.preventDefault();
        return;
      }
      if (event.key === 'ArrowRight' || event.key === 'PageDown' || event.key === ' ') {
        event.preventDefault();
        setActive(current + 1);
      }
      if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
        event.preventDefault();
        setActive(current - 1);
      }
      if (event.key === 'Home') {
        event.preventDefault();
        setActive(0);
      }
      if (event.key === 'End') {
        event.preventDefault();
        setActive(slides.length - 1);
      }
      if (event.key.toLowerCase() === 'n') {
        narrationEnabled = !narrationEnabled;
        if (!narrationEnabled) {
          narrationAudio.pause();
          narrationAudio.currentTime = 0;
          setMusicVolume(musicBaseVolume, 260);
        } else {
          playNarrationForCurrentSlide();
        }
      }
      if (event.key.toLowerCase() === 'a') {
        autoAdvanceEnabled = !autoAdvanceEnabled;
      }
      if (event.key.toLowerCase() === 'm') {
        backgroundMusicEnabled = !backgroundMusicEnabled;
        if (!backgroundMusicEnabled) {
          if (musicFadeTimer) {
            clearInterval(musicFadeTimer);
            musicFadeTimer = null;
          }
          backgroundAudio.pause();
        } else {
          backgroundAudio.volume = narrationEnabled ? musicDuckedVolume : musicBaseVolume;
          playBackgroundMusic();
        }
      }
      if (event.key.toLowerCase() === 't') {
        narrationTextVisible = !narrationTextVisible;
        window.localStorage.setItem('showNarrationText', narrationTextVisible ? '1' : '0');
        applyNarrationTextVisibility();
      }
    });

    narrationAudio.addEventListener('timeupdate', updateCaption);
    narrationAudio.addEventListener('seeked', updateCaption);

    document.addEventListener('click', (event) => {
      const justStarted = unlockNarration();
      if (justStarted) {
        return;
      }
      const rect = document.body.getBoundingClientRect();
      if (event.clientX > rect.width * 0.5) {
        setActive(current + 1);
      } else {
        setActive(current - 1);
      }
    });

    updateStageScale();
    window.addEventListener('resize', updateStageScale);
    initializeNarrationTextPreference();
    render();
    beginExperienceOnLoad();
  </script>
</body>
</html>
