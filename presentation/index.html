<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>From Folk Authenticity to Populist Politics</title>
  <style>
    :root {
      --bg: #090909;
      --panel: #111111;
      --panel-2: #151515;
      --text: #f2f2f2;
      --muted: #b8b8b8;
      --soft: #8d8d8d;
      --line: rgba(255, 255, 255, 0.14);
      --accent: #ffffff;
      --burns-red: #9d1f1f;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.05), transparent 28%),
        radial-gradient(circle at 80% 10%, rgba(255,255,255,0.03), transparent 18%),
        linear-gradient(180deg, #050505 0%, #0d0d0d 100%);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100% 4px, 4px 100%;
      opacity: 0.35;
      mix-blend-mode: screen;
    }

    .deck {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 420ms ease;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent 25%);
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    .visual {
      position: relative;
      overflow: hidden;
      border-right: 1px solid var(--line);
      background: #0b0b0b;
    }

    .visual::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.08), rgba(0,0,0,0.38));
      pointer-events: none;
    }

    .kenburns {
      position: absolute;
      inset: -8%;
      width: 116%;
      height: 116%;
      object-fit: cover;
      filter: grayscale(1) contrast(1.18) brightness(0.92);
      transform-origin: center center;
      transform: translate3d(var(--from-x, 0%), var(--from-y, 0%), 0) scale(var(--from-scale, 1.04));
      animation: kenburnsMove var(--kenburns-duration, 20s) ease-in-out infinite alternate;
      opacity: 0.95;
    }

    .kenburns.alt {
      animation-duration: 22s;
    }

    .kenburns.soft {
      animation-duration: 25s;
    }

    .content {
      padding: 7vh 5vw 6vh 4.6vw;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 2.2vh;
      background:
        radial-gradient(circle at top right, rgba(255,255,255,0.08), transparent 30%),
        linear-gradient(180deg, rgba(255,255,255,0.03), transparent 18%);
    }

    .eyebrow {
      font-family: Arial, Helvetica, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.23em;
      font-size: 12px;
      color: var(--soft);
    }

    h1, h2 {
      margin: 0;
      font-weight: 600;
      line-height: 0.96;
      text-wrap: balance;
    }

    h1 {
      font-size: clamp(3rem, 5vw, 5.3rem);
      max-width: 10ch;
    }

    h2 {
      font-size: clamp(2.3rem, 4.1vw, 4.3rem);
      max-width: 12ch;
    }

    .deck-title {
      margin-top: 0.2rem;
      font-size: clamp(1rem, 1.45vw, 1.2rem);
      color: var(--muted);
      max-width: 34rem;
      line-height: 1.55;
    }

    .title-divider {
      width: min(13rem, 36vw);
      height: 3px;
      margin: 0.95rem 0 0.7rem;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(157, 31, 31, 0.96), rgba(157, 31, 31, 0.35));
      box-shadow: 0 0 18px rgba(157, 31, 31, 0.25);
    }

    .narration {
      align-self: end;
      max-width: 34rem;
      font-size: clamp(1.08rem, 1.35vw, 1.35rem);
      line-height: 1.7;
      color: var(--text);
      text-wrap: pretty;
      display: none;
      visibility: hidden;
      height: 0;
      margin: 0;
      overflow: hidden;
    }

    body.show-narration-text .narration {
      display: block;
      visibility: visible;
      height: auto;
      margin: 0;
      overflow: visible;
    }


    .subline {
      max-width: 32rem;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.65;
    }

    .footer {
      display: flex;
      align-items: end;
      justify-content: flex-end;
      gap: 1rem;
      color: var(--soft);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .counter {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.5rem 0.82rem;
      background: rgba(255,255,255,0.03);
    }

    .hint {
      opacity: 0.75;
    }

    .notes {
      display: none;
    }

    @keyframes kenburnsMove {
      0% {
        transform: translate3d(var(--from-x, 0%), var(--from-y, 0%), 0) scale(var(--from-scale, 1.04));
      }
      100% {
        transform: translate3d(var(--to-x, -4%), var(--to-y, -3%), 0) scale(var(--to-scale, 1.16));
      }
    }

    @media (max-width: 920px) {
      .slide {
        grid-template-columns: 1fr;
        grid-template-rows: 44vh 1fr;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-y: contain;
      }

      .visual {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .content {
        padding: 4vh 6vw 4.5vh;
        grid-template-rows: auto auto auto auto;
        align-content: start;
      }

      h1, h2 {
        max-width: none;
      }

      .narration, .deck-title, .subline {
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <main class="deck" id="deck"></main>

  <template id="slide-template">
    <section class="slide">
      <div class="visual">
        <img class="kenburns" alt="" />
      </div>
      <div class="content">
        <div class="eyebrow"></div>
        <div>
          <h1></h1>
          <div class="title-divider" aria-hidden="true"></div>
          <p class="deck-title"></p>
        </div>
        <div class="narration" aria-hidden="true"></div>
        <div class="footer"></div>
      </div>
    </section>
  </template>

  <script>
    const slides = [
      {
        eyebrow: "Opening",
        title: "Authenticity becomes political",
        subtitle: "It began with a playlist.",
        narration: "No one knew that behind the banjos, the beards, and the folksy swagger was a deeper question: who gets to decide what is real?",
        image: "assets/opening.jpg",
        variant: ""
      },
      {
        eyebrow: "The folk ideal",
        title: "The promise of sincerity",
        subtitle: "Wood, wire, and a room that sings in unison.",
        narration: "After decades of over processed culture, people began searching for something authentic. Preferably something made from reclaimed wood, organic waxed cotton, and a person who looked like they ate lentil soup.",
        image: "assets/folk-ideal.jpg",
        variant: "alt"
      },
      {
        eyebrow: "The hey band bloom",
        title: "The earnest chorus arrives",
        subtitle: "Handclaps become social policy.",
        narration: "Then a band like Mummford an Sons comes along and scales the feeling. What was once a novel sound becomes arena ritual, and everyone learns to clap on command. The banjo returned not as an instrument, but as a movement.",
        image: "assets/hey-band.jpg",
        variant: "soft"
      }, 
      {
        eyebrow: "Interview",
        title: "Back to roots, or so it felt",
        subtitle: "A voice from inside the vibe.",
        narration: "I mean... I thought we were just getting back to something honest. You know, we were clapping and yelling, HEY!, because it felt alive. Not because we thought it meant anything bigger. And then... looking back now, that was kind of the point. It felt harmless, while it was teaching us how to move together on cue.",
        image: "assets/hipster-interview.jpg",
        variant: "alt"
      },
      // {
      //   eyebrow: "Bacon becomes worldview",
      //   title: "When breakfast becomes a position",
      //   subtitle: "Salt, smoke, and the household as institution.",
      //   narration: "At some point, bacon stopped being just food and became a vibe. People started curing it at home, comparing methods, and treating the kitchen like a statement about how life should work. Kale wasn't really the enemy, but it became a stand-in for the kind of advice people were tired of hearing.",
      //   image: "assets/bacon.jpg",
      //   variant: ""
      // },
      {
        eyebrow: "The cocktail turn",
        title: "Craft cocktails enter the republic",
        subtitle: "Measure, stir, repeat.",
        narration: "Meanwhile, the pursuit of authenticity creeps into every aspect of life. At the bar, precision becomes morality. The right ice, the correct glass, the approved origin story. Technique stands in for truth.",
        image: "assets/cocktail.jpg",
        variant: "soft"
      },
      {
        eyebrow: "The authenticity industrial complex",
        title: "The rejection gets repackaged",
        subtitle: "The market never misses a mood, or a membership signal.",
        narration: "The movement began as a rejection of consumer culture. Then it spread: from folk stages to craft cocktail bars, bacon curing, and food scenes where authenticity became performance. Consumer culture did what it does best: it sold the rejection back at scale, with better branding, nicer packaging, and a higher margin. The beard corridor followed, where local became a credential and taste became social sorting.",
        image: "assets/beard-corridor.jpg",
        variant: "alt"
      },
      {
        eyebrow: "Self-reliance",
        title: "Trust yourself, trust others less",
        subtitle: "Pantry, survival, and the politics of independence.",
        narration: "Self-reliance is practical until it becomes theology. Knowing how to fix a sink is useful. Believing nobody else can fix anything is politics.",
        image: "assets/self-reliance.jpg",
        variant: ""
      },
      {
        eyebrow: "Wellness panic",
        title: "Purity becomes panic",
        subtitle: "Ingredient lists as prophecy.",
        narration: "A search for better ingredients becomes a search for hidden enemies. Distrust begins with words on labels people cannot read or pronounce, then expands to medicine, public systems, and finally reality itself.",
        image: "assets/wellness-panic.jpg",
        variant: "soft"
      },
      {
        eyebrow: "Anti-elite drift",
        title: "Suspicion replaces evidence",
        subtitle: "Everyone is lying, all the time.",
        narration: "Legitimate critique mutates into permanent suspicion. Distrust begins with corporations, then expands to universities, then medicine, then elections. Eventually, the only trustworthy source is the person telling you not to trust anyone.",
        image: "assets/anti-elite-drift.jpg",
        variant: "alt"
      },
      {
        eyebrow: "The acoustic pipeline",
        title: "Style travels faster than ideology",
        subtitle: "The soundtrack crosses the border first.",
        narration: "Years later, the early aesthetic reads like a preamble. The soundtrack entered the room before the argument, followed by nostalgia for European purity myths dressed up as tradition.",
        image: "assets/acoustic-pipeline.jpg",
        variant: ""
      },
      {
        eyebrow: "The feed",
        title: "Authenticity becomes inventory",
        subtitle: "The algorithm discovers a market.",
        narration: "Corporations sell hand made, influencers sell independence, politicians sell outsider status, and algorithms reward outrage. Two product lines scale fastest: MAGA for national grievance, MAHA for biological, grievance.",
        image: "assets/maga.jpg",
        variant: "alt"
      },
      {
        eyebrow: "The irony economy",
        title: "From Vice to grievance",
        subtitle: "Snark opens the gate.",
        narration: "The VICE-era internet turns politics into posture. Richard Spencer becomes part of the recurring cast. Irony offers plausible deniability: if challenged, it was just a joke; if rewarded, it was sincere. What looked like clever distance became cover.",
        image: "assets/outrage.jpg",
        variant: "alt"
      },
      {
        eyebrow: "Populism",
        title: "From belonging to hierarchy",
        subtitle: "Then Trump, as acceleration not conclusion.",
        narration: "Trump did not invent the desire for authenticity. He exploited it, with MAGA and MAHA running as twin rails: one about borders and belonging, the other about bodies and contamination, both optimized for repetition. The point is not a single man. The point is a system now tuned for grievance.",
        image: "assets/irony-economy.jpg",
        variant: "soft"
      },
      {
        eyebrow: "Consequences",
        title: "What fascist culture leaves behind",
        subtitle: "Pluralism thins out, then institutions do.",
        narration: "Once grievance becomes a business model, fascist politics stop sounding fringe and start sounding normal. Damage moves from screens to systems: public-health trust collapses, school boards become proxy battlefields, and state power is aimed at enemies instead of problems. The consequence is not only who wins office. It is a country that struggles to agree on what is real, and then loses the habit of sharing power.",
        image: "assets/populism.jpg",
        variant: "alt"
      },
      {
        eyebrow: "Finale",
        title: "The empire burns",
        subtitle: "Mumford fiddles.",
        narration: "Thank you.   This wouldn't be possible without viewers like you.",
        image: "assets/empire-burns.jpg",
        variant: "alt"
      }
    ];

    const deck = document.getElementById('deck');
    const template = document.getElementById('slide-template');
    let current = 0;
    const nodes = [];
    const narrationAudio = new Audio();
    narrationAudio.preload = 'auto';
    const backgroundAudio = new Audio();
    backgroundAudio.preload = 'auto';
    backgroundAudio.loop = true;
    const musicBaseVolume = 0.20;
    const musicDuckedVolume = 0.13;
    const backgroundAudioSources = [
      'assets/bluegrass.mp3',
      'assets/Mountain Melodies ｜ Bluegrass Music for a Peaceful Escape [C0kKLtuCtP8].mp3'
    ];
    let activeMusicSourceIndex = 0;
    backgroundAudio.volume = musicBaseVolume;
    backgroundAudio.src = encodeURI(backgroundAudioSources[activeMusicSourceIndex]);
    let narrationEnabled = true;
    let narrationUnlocked = false;
    let narrationTextVisible = false;
    let autoAdvanceEnabled = true;
    let backgroundMusicEnabled = true;
    let musicFadeTimer = null;
    let autoAdvanceTimer = null;
    const autoAdvanceDelayMs = 3200;

    function setMusicVolume(targetVolume, durationMs = 260) {
      if (!backgroundMusicEnabled) {
        return;
      }

      const startVolume = backgroundAudio.volume;
      const clampedTarget = Math.max(0, Math.min(1, targetVolume));

      if (musicFadeTimer) {
        clearInterval(musicFadeTimer);
        musicFadeTimer = null;
      }

      if (Math.abs(startVolume - clampedTarget) < 0.002 || durationMs <= 0) {
        backgroundAudio.volume = clampedTarget;
        return;
      }

      const frameMs = 30;
      const steps = Math.max(1, Math.round(durationMs / frameMs));
      let step = 0;

      musicFadeTimer = setInterval(() => {
        step += 1;
        const progress = Math.min(1, step / steps);
        backgroundAudio.volume = startVolume + (clampedTarget - startVolume) * progress;
        if (progress >= 1) {
          clearInterval(musicFadeTimer);
          musicFadeTimer = null;
        }
      }, frameMs);
    }

    function applyNarrationTextVisibility() {
      document.body.classList.toggle('show-narration-text', narrationTextVisible);
    }

    function initializeNarrationTextPreference() {
      const params = new URLSearchParams(window.location.search);
      const queryPref = params.get('showNarration');
      const storedPref = window.localStorage.getItem('showNarrationText');
      narrationTextVisible = queryPref === '1' || storedPref === '1';
      applyNarrationTextVisibility();
    }

    function audioPathForSlide(index) {
      return `assets/narration/slide-${String(index + 1).padStart(2, '0')}.wav`;
    }

    function playNarrationForCurrentSlide() {
      if (!narrationEnabled || !narrationUnlocked) {
        return;
      }

      playBackgroundMusic();
      setMusicVolume(musicDuckedVolume, 220);

      const nextSource = audioPathForSlide(current);
      const existing = narrationAudio.getAttribute('src');
      if (existing !== nextSource) {
        narrationAudio.setAttribute('src', nextSource);
      } else {
        narrationAudio.currentTime = 0;
      }

      narrationAudio.play().catch(() => {
        // Browser may block autoplay before user interaction; this fails safely.
      });
    }

    function playBackgroundMusic() {
      if (!backgroundMusicEnabled || !narrationUnlocked) {
        return;
      }

      backgroundAudio.muted = false;
      if (backgroundAudio.src === '') {
        backgroundAudio.src = encodeURI(backgroundAudioSources[activeMusicSourceIndex]);
      }

      backgroundAudio.play().catch(() => {
        // Browser may block autoplay before user interaction; this fails safely.
      });
    }

    backgroundAudio.addEventListener('error', () => {
      if (activeMusicSourceIndex >= backgroundAudioSources.length - 1) {
        return;
      }

      activeMusicSourceIndex += 1;
      backgroundAudio.src = encodeURI(backgroundAudioSources[activeMusicSourceIndex]);
      if (narrationUnlocked && backgroundMusicEnabled) {
        playBackgroundMusic();
      }
    });

    function unlockNarration() {
      if (!narrationUnlocked) {
        narrationUnlocked = true;
        playBackgroundMusic();
        playNarrationForCurrentSlide();
      }
    }

    narrationAudio.addEventListener('ended', () => {
      if (!autoAdvanceEnabled) {
        setMusicVolume(musicBaseVolume, 420);
        return;
      }
      if (current < slides.length - 1) {
        if (autoAdvanceTimer) {
          clearTimeout(autoAdvanceTimer);
          autoAdvanceTimer = null;
        }
        autoAdvanceTimer = setTimeout(() => {
          autoAdvanceTimer = null;
          setActive(current + 1);
        }, autoAdvanceDelayMs);
        return;
      }
      setMusicVolume(musicBaseVolume, 420);
    });

    function createSlide(data, index) {
      const node = template.content.cloneNode(true);
      const slide = node.querySelector('.slide');
      const eyebrow = node.querySelector('.eyebrow');
      const title = node.querySelector('h1');
      const subtitle = node.querySelector('.deck-title');
      const narration = node.querySelector('.narration');
      const counter = node.querySelector('.counter');
      const visual = node.querySelector('.kenburns');

      eyebrow.textContent = data.eyebrow;
      title.textContent = data.title;
      subtitle.textContent = data.subtitle;
      narration.textContent = data.narration;
      if (counter) {
        counter.textContent = `${String(index + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;
      }
      if (data.variant) {
        visual.classList.add(data.variant);
      }
      visual.src = data.image;
      const motionPresets = [
        { fromX: '0%', fromY: '0%', toX: '-4%', toY: '-3%', fromScale: '1.04', toScale: '1.18' },
        { fromX: '-2%', fromY: '-1%', toX: '3%', toY: '2%', fromScale: '1.05', toScale: '1.19' },
        { fromX: '2%', fromY: '-2%', toX: '-3%', toY: '2%', fromScale: '1.03', toScale: '1.17' },
        { fromX: '-1%', fromY: '1%', toX: '2%', toY: '-3%', fromScale: '1.04', toScale: '1.16' }
      ];
      const motion = motionPresets[index % motionPresets.length];
      const wordCount = data.narration.trim().split(/\s+/).length;
      const paceSeconds = Math.max(20, Math.min(28, Math.round(wordCount / 3) + 14));
      visual.style.setProperty('--from-x', motion.fromX);
      visual.style.setProperty('--from-y', motion.fromY);
      visual.style.setProperty('--to-x', motion.toX);
      visual.style.setProperty('--to-y', motion.toY);
      visual.style.setProperty('--from-scale', motion.fromScale);
      visual.style.setProperty('--to-scale', motion.toScale);
      visual.style.setProperty('--kenburns-duration', `${paceSeconds}s`);
      slide.dataset.index = index;
      return slide;
    }

    function render() {
      deck.innerHTML = '';
      slides.forEach((slide, index) => {
        const node = createSlide(slide, index);
        deck.appendChild(node);
        nodes.push(node);
      });
      setActive(0, false);
    }

    function setActive(index, animate = true) {
      if (autoAdvanceTimer) {
        clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = null;
      }
      current = Math.max(0, Math.min(index, slides.length - 1));
      nodes.forEach((node, i) => node.classList.toggle('active', i === current));
      if (!animate) {
        nodes[current].style.transition = 'none';
        requestAnimationFrame(() => {
          nodes[current].style.transition = '';
        });
      }
      playNarrationForCurrentSlide();
    }

    document.addEventListener('keydown', (event) => {
      unlockNarration();
      if (event.key === 'ArrowRight' || event.key === 'PageDown' || event.key === ' ') {
        event.preventDefault();
        setActive(current + 1);
      }
      if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
        event.preventDefault();
        setActive(current - 1);
      }
      if (event.key === 'Home') {
        event.preventDefault();
        setActive(0);
      }
      if (event.key === 'End') {
        event.preventDefault();
        setActive(slides.length - 1);
      }
      if (event.key.toLowerCase() === 'n') {
        narrationEnabled = !narrationEnabled;
        if (!narrationEnabled) {
          narrationAudio.pause();
          narrationAudio.currentTime = 0;
          setMusicVolume(musicBaseVolume, 260);
        } else {
          playNarrationForCurrentSlide();
        }
      }
      if (event.key.toLowerCase() === 'a') {
        autoAdvanceEnabled = !autoAdvanceEnabled;
      }
      if (event.key.toLowerCase() === 'm') {
        backgroundMusicEnabled = !backgroundMusicEnabled;
        if (!backgroundMusicEnabled) {
          if (musicFadeTimer) {
            clearInterval(musicFadeTimer);
            musicFadeTimer = null;
          }
          backgroundAudio.pause();
        } else {
          backgroundAudio.volume = narrationEnabled ? musicDuckedVolume : musicBaseVolume;
          playBackgroundMusic();
        }
      }
      if (event.key.toLowerCase() === 't') {
        narrationTextVisible = !narrationTextVisible;
        window.localStorage.setItem('showNarrationText', narrationTextVisible ? '1' : '0');
        applyNarrationTextVisibility();
      }
    });

    document.addEventListener('click', (event) => {
      unlockNarration();
      const rect = document.body.getBoundingClientRect();
      if (event.clientX > rect.width * 0.5) {
        setActive(current + 1);
      } else {
        setActive(current - 1);
      }
    });

    initializeNarrationTextPreference();
    render();
  </script>
</body>
</html>
